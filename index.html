<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2068 益智小游戏入口</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a8e6ff, #ffd6a5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .card {
      width: min(600px, 100%);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
      padding: 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      color: #2a4b6f;
    }
    p {
      margin: 0 0 24px;
      line-height: 1.7;
      color: #555;
    }
    .link-button {
      display: inline-block;
      padding: 16px 26px;
      border-radius: 999px;
      text-decoration: none;
      background: #ff7a7a;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(255, 122, 122, 0.32);
      transition: transform 150ms ease, background 150ms ease;
    }
    .link-button:hover {
      transform: translateY(-2px);
      background: #e55c5c;
    }
    .note {
      margin-top: 18px;
      color: #777;
      font-size: 0.95rem;
    }
    .share-box {
      margin-top: 18px;
      display: grid;
      gap: 10px;
      justify-items: center;
    }
    .share-box input {
      width: 100%;
      max-width: 520px;
      padding: 12px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 14px;
      font-size: 0.95rem;
      color: #333;
      background: #fafafa;
    }
    .share-box button {
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      background: #2a4b6f;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease;
    }
    .share-box button:hover {
      background: #244163;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>2068 益智小游戏入口</h1>
    <p>点击下面按钮即可打开游戏页面。发布到 GitHub Pages 后，把本页链接发给朋友，不在同一个局域网也可以打开体验。</p>
    <a class="link-button" href="2068-kids.html">打开 2068 游戏</a>
    <p class="note">请将 `index.html` 和 `2068-kids.html` 放在同一个 GitHub 仓库根目录，开启 GitHub Pages 后即可公网访问。</p>
    <div class="share-box">
      <input id="share-url" type="text" readonly value="" placeholder="发布到 GitHub Pages 后会自动显示分享链接" />
      <button id="copy-btn">复制分享链接</button>
    </div>
    <p class="note">如果直接双击本地文件打开，分享框不会生成公网链接；发布成功后再复制这里的链接。</p>
  </div>
  <script>
    const shareUrlInput = document.getElementById('share-url');
    const copyBtn = document.getElementById('copy-btn');
    const isHostedPage = window.location.protocol === 'http:' || window.location.protocol === 'https:';

    if (isHostedPage) {
      shareUrlInput.value = window.location.href;
    } else {
      shareUrlInput.value = '发布到 GitHub Pages 后会自动显示分享链接';
    }

    copyBtn.addEventListener('click', async () => {
      if (!isHostedPage) {
        copyBtn.textContent = '发布后再复制';
        setTimeout(() => { copyBtn.textContent = '复制分享链接'; }, 1500);
        return;
      }

      shareUrlInput.select();
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(shareUrlInput.value);
      } else {
        document.execCommand('copy');
      }
      copyBtn.textContent = '已复制';
      setTimeout(() => { copyBtn.textContent = '复制分享链接'; }, 1500);
    });
  </script>
</body>
</html>
