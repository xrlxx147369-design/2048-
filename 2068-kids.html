<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2068 四宫格益智小游戏</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFE7A3 0%, #FFB4B4 100%);
      color: #333;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      overscroll-behavior: none;
    }

    .container {
      width: min(100%, 420px);
      height: 100%;
      margin: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      position: relative;
      padding: 20px 18px;
      text-align: center;
      background: #ffefdb;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #d64f76;
    }

    .help-icon {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #d64f76;
      background: #fff;
      color: #d64f76;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    header p {
      margin: 10px 0 0;
      color: #6d4c41;
      font-size: 1rem;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .game-panel,
    .tips-panel {
      background: #fafafa;
      border-radius: 20px;
      padding: 20px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .game-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .score-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      align-items: stretch;
    }

    .score-box {
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
      text-align: center;
      box-sizing: border-box;
    }

    .score-box strong {
      display: block;
      font-size: 1.25rem;
      color: #d64f76;
    }

    .score-box span {
      color: #72574d;
      margin-top: 4px;
      display: block;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(55px, 1fr));
      gap: 6px;
      padding: 4px;
      flex: 1;
      min-height: 0;
      margin-bottom: 26px;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .board.dragging {
      cursor: grabbing;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #4f2b1f;
      background: #f2e3d1;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
      transition: background 200ms ease, color 200ms ease;
    }

    .tile.empty {
      background: rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.04);
      color: transparent;
    }

    .tile[data-value="2"] { background: #f8f0d6; }
    .tile[data-value="4"] { background: #f5e2b8; }
    .tile[data-value="8"] { background: #f4c47b; color: #fff; }
    .tile[data-value="16"] { background: #f49f53; color: #fff; }
    .tile[data-value="32"] { background: #f57f4a; color: #fff; }
    .tile[data-value="64"] { background: #ec5d3a; color: #fff; }
    .tile[data-value="128"] { background: #f7d86d; color: #fff; font-size: 1.1rem; }
    .tile[data-value="256"] { background: #f5c24e; color: #fff; font-size: 1.1rem; }
    .tile[data-value="512"] { background: #f2b22b; color: #fff; font-size: 1rem; }
    .tile[data-value="1024"] { background: #d99723; color: #fff; font-size: 0.95rem; }
    .tile[data-value="2048"] { background: #b17a1b; color: #fff; font-size: 0.85rem; }
    .tile[data-value="4096"] { background: #8a5c1a; color: #fff; font-size: 0.85rem; }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 76px;
      padding-bottom: 12px;
    }

    .controls button {
      border: none;
      border-radius: 16px;
      padding: 14px 22px;
      width: min(280px, 94%);
      font-size: 1.05rem;
      cursor: pointer;
      color: #fff;
      background: #d64f76;
      transition: transform 150ms ease, background 150ms ease;
    }

    .controls button.full-width {
      width: min(280px, 95%);
    }

    .controls button:hover {
      transform: translateY(-2px);
      background: #c93f6a;
    }

    .tips-panel h2 {
      margin-top: 0;
      color: #d64f76;
    }

    .help-icon:hover {
      background: #fbe8ef;
      transform: scale(1.05);
    }

    .tips-panel ul {
      padding-left: 20px;
      margin: 0;
      color: #4f3a33;
      line-height: 1.7;
    }

    .tips-panel li {
      margin-bottom: 12px;
    }

    .hint-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      border: 1px dashed #f0c3c3;
      margin-top: 18px;
      color: #5b3a3a;
    }

    .note {
      margin-top: 12px;
      color: #8a6f5c;
      font-size: 0.95rem;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
    }

    .modal {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.18);
      padding: 20px;
      max-height: 90vh;
      overflow: auto;
    }

    .modal h3 {
      margin: 0 0 12px;
      color: #d64f76;
      font-size: 1.2rem;
    }

    .modal ul {
      padding-left: 20px;
      margin: 0;
      line-height: 1.7;
      color: #4f3a33;
    }

    .modal button {
      margin-top: 18px;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      background: #d64f76;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    @media (max-width: 840px) {
      body {
        padding: 12px;
      }
      .container {
        border-radius: 20px;
      }
      header {
        padding: 18px 16px;
      }
      .main {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 18px;
      }
      .score-row {
        flex-direction: row;
      }
      .board {
        grid-template-columns: repeat(4, minmax(55px, 1fr));
        gap: 8px;
        margin-bottom: 36px;
      }
      .controls {
        display: flex;
        justify-content: center;
        margin-top: 86px;
      }
      .controls button {
        width: min(280px, 95%);
      }
      .tips-panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>2068 趣味练习</h1>
      <button class="help-icon" id="helpBtn" aria-label="查看提示">?</button>
    </header>

    <div class="main">
      <section class="game-panel">
        <div class="score-row">
          <div class="score-box">
            <strong id="score">0</strong>
            <span>当前得分</span>
          </div>
          <div class="score-box">
            <strong id="best">0</strong>
            <span>历史最佳</span>
          </div>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
          <button id="btn-restart">重新开始</button>
        </div>

      </section>

    </div>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3>小朋友练习提示</h3>
      <ul>
        <li>观察每一步：先看哪一行或哪一列有相同数字。</li>
        <li>规划方向：想好先向一侧靠拢再移动，提高成功率。</li>
        <li>保持角落稳定：把最大数字放在一个角落，方便组合。</li>
        <li>一步一步来：不要急着乱动，先想两步后可能发生的合并。</li>
        <li>学会等待：有时候暂时不合并也是最好的选择。</li>
      </ul>
      <button id="closeModal">知道了</button>
    </div>
  </div>

  <script>
    const boardElement = document.getElementById('board');
    const scoreElement = document.getElementById('score');
    const bestElement = document.getElementById('best');
    const btnRestart = document.getElementById('btn-restart');

    const size = 4;
    let grid = [];
    let score = 0;
    let bestScore = 0;
    let audioContext = null;
    let mergesThisMove = 0;

    function initGrid() {
      grid = Array.from({ length: size }, () => Array(size).fill(0));
      score = 0;
      addRandomTile();
      addRandomTile();
      updateBoard();
    }

    function addRandomTile() {
      const empties = [];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (grid[row][col] === 0) empties.push({ row, col });
        }
      }
      if (empties.length === 0) return;
      const { row, col } = empties[Math.floor(Math.random() * empties.length)];
      grid[row][col] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateBoard() {
      boardElement.innerHTML = '';
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const value = grid[row][col];
          const tile = document.createElement('div');
          tile.className = 'tile';
          if (value === 0) {
            tile.classList.add('empty');
          } else {
            tile.dataset.value = value;
            tile.textContent = value;
          }
          boardElement.appendChild(tile);
        }
      }
      scoreElement.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestElement.textContent = bestScore;
      }
    }

    function compress(row) {
      const newRow = row.filter(v => v !== 0);
      while (newRow.length < size) newRow.push(0);
      return newRow;
    }

    function merge(row) {
      for (let i = 0; i < size - 1; i++) {
        if (row[i] !== 0 && row[i] === row[i + 1]) {
          row[i] *= 2;
          row[i + 1] = 0;
          score += row[i];
          mergesThisMove += 1;
        }
      }
      return row;
    }

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      return audioContext;
    }

    function unlockAudio() {
      const context = getAudioContext();
      if (!context) return;

      if (context.state === 'suspended') {
        context.resume().catch(() => {});
      }
    }

    async function playMergeSound(index = 0) {
      const context = getAudioContext();
      if (!context) return;

      if (context.state === 'suspended') {
        await context.resume().catch(() => {});
      }

      if (context.state !== 'running') return;

      const now = context.currentTime + index * 0.08;
      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = 'triangle';
      oscillator.frequency.setValueAtTime(740, now);
      oscillator.frequency.exponentialRampToValueAtTime(1180, now + 0.08);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.addEventListener('ended', () => {
        oscillator.disconnect();
        gain.disconnect();
      });
      oscillator.start(now);
      oscillator.stop(now + 0.24);
    }

    function moveLeft() {
      let moved = false;
      for (let row = 0; row < size; row++) {
        let current = [...grid[row]];
        current = compress(current);
        current = merge(current);
        current = compress(current);
        if (!current.every((val, idx) => val === grid[row][idx])) {
          moved = true;
        }
        grid[row] = current;
      }
      return moved;
    }

    function moveRight() {
      grid = grid.map(row => row.reverse());
      const moved = moveLeft();
      grid = grid.map(row => row.reverse());
      return moved;
    }

    function transpose(matrix) {
      return matrix[0].map((_, colIndex) => matrix.map(row => row[colIndex]));
    }

    function moveUp() {
      grid = transpose(grid);
      const moved = moveLeft();
      grid = transpose(grid);
      return moved;
    }

    function moveDown() {
      grid = transpose(grid);
      const moved = moveRight();
      grid = transpose(grid);
      return moved;
    }

    function canMove() {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (grid[row][col] === 0) return true;
          if (col < size - 1 && grid[row][col] === grid[row][col + 1]) return true;
          if (row < size - 1 && grid[row][col] === grid[row + 1][col]) return true;
        }
      }
      return false;
    }

    function handleMove(moveFn) {
      unlockAudio();
      mergesThisMove = 0;
      const moved = moveFn();
      if (!moved) return;
      addRandomTile();
      updateBoard();
      if (mergesThisMove > 0) {
        for (let i = 0; i < mergesThisMove; i++) {
          void playMergeSound(i);
        }
      }
      if (!canMove()) {
        setTimeout(() => alert('游戏结束！再试一次，继续锻炼逻辑思维吧！'), 100);
      }
    }

    btnRestart.addEventListener('click', () => {
      unlockAudio();
      initGrid();
    });

    const helpBtn = document.getElementById('helpBtn');
    const modalMask = document.getElementById('modalMask');
    const closeModal = document.getElementById('closeModal');

    helpBtn.addEventListener('click', () => {
      unlockAudio();
      modalMask.style.display = 'flex';
    });

    closeModal.addEventListener('click', () => {
      modalMask.style.display = 'none';
    });

    modalMask.addEventListener('click', (event) => {
      if (event.target === modalMask) {
        modalMask.style.display = 'none';
      }
    });

    let pointerStartX = 0;
    let pointerStartY = 0;
    let activePointerId = null;

    function handleSwipe(startX, startY, endX, endY) {
      const dx = endX - startX;
      const dy = endY - startY;
      const threshold = 30;

      if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) handleMove(moveRight);
        else handleMove(moveLeft);
      } else {
        if (dy > 0) handleMove(moveDown);
        else handleMove(moveUp);
      }
    }

    function stopPointerDrag() {
      activePointerId = null;
      boardElement.classList.remove('dragging');
    }

    boardElement.addEventListener('pointerdown', (event) => {
      if (activePointerId !== null) return;
      if (event.pointerType === 'mouse' && event.button !== 0) return;

      activePointerId = event.pointerId;
      pointerStartX = event.clientX;
      pointerStartY = event.clientY;
      unlockAudio();
      boardElement.classList.add('dragging');
      if (boardElement.setPointerCapture) {
        boardElement.setPointerCapture(event.pointerId);
      }
      event.preventDefault();
    });

    boardElement.addEventListener('pointerup', (event) => {
      if (event.pointerId !== activePointerId) return;

      handleSwipe(pointerStartX, pointerStartY, event.clientX, event.clientY);
      if (boardElement.hasPointerCapture && boardElement.hasPointerCapture(event.pointerId)) {
        boardElement.releasePointerCapture(event.pointerId);
      }
      stopPointerDrag();
    });

    boardElement.addEventListener('pointercancel', (event) => {
      if (event.pointerId !== activePointerId) return;
      stopPointerDrag();
    });

    window.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
        event.preventDefault();
        unlockAudio();
        if (event.key === 'ArrowUp') handleMove(moveUp);
        if (event.key === 'ArrowDown') handleMove(moveDown);
        if (event.key === 'ArrowLeft') handleMove(moveLeft);
        if (event.key === 'ArrowRight') handleMove(moveRight);
      }
    });

    initGrid();
  </script>
</body>
</html>
